# Round-2 "bigger-GPU arm" — prompted LLM-as-judge on a real NVIDIA GPU (NRP/Nautilus).
#
# Answers Round 1's open question: is the ~0.3–0.5 QWK ceiling the TASK or the MODEL SIZE?
# Method held constant vs Round-1 Arm B (arms/ollama_prompt.mjs) — same judge prompt, same
# parser, same held-out eval sets, same QWK formula — only the model + hardware change.
#
# Model: Qwen/Qwen2.5-7B-Instruct (OPEN, ungated). Preferred Llama-3.1-8B-Instruct is gated
#   and no HF_TOKEN was available in the worker env, so this is the fallback. CONFOUND noted in
#   the journal: this changes model FAMILY as well as size vs Arm B's Llama-3.2-3B.
# GPU: 1× NVIDIA RTX A6000 (48 GB) — non-quota-gated, non-preemptible (no opportunistic
#   priorityClassName), within the 2-GPU non-preemptible limit. 48 GB fits 7B fp16 with room
#   to spare (also headroom for a later 14B arm).
# Data + code staged via ConfigMaps (round2-data = gzipped eval jsonl; round2-code =
#   gpu_judge.py + the byte-identical composed system prompt). Results → stdout logs
#   (RESULTS_JSON_BEGIN/END markers), collected with `kubectl logs`.
apiVersion: batch/v1
kind: Job
metadata:
  name: round2-gpu-judge-8b
  namespace: kennesaw-state-fjacob
  labels:
    app: cortex-round2-gpu-arm
spec:
  backoffLimit: 0            # do not retry a GPU run automatically
  activeDeadlineSeconds: 7200  # 90 min is plenty; hard cap so the job never sits idle
  ttlSecondsAfterFinished: 172800  # keep the finished pod/logs 48h for collection
  template:
    metadata:
      labels:
        app: cortex-round2-gpu-arm
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            # Any non-quota-gated >=24GB card fits Qwen2.5-7B (fp16 ~15GB) with room for the
            # KV cache at max_model_len 4096. A6000s were all busy, so select from a broad
            # pool of plentiful 24-48GB cards instead of pinning one product. (A100/H100/H200/
            # GH200 are deliberately excluded: quota-gated and advertised under custom resource
            # names, not the generic nvidia.com/gpu this Job requests.)
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-GeForce-RTX-3090   # 24GB, dozens free
                - NVIDIA-A10                 # 24GB, dozens free
                - NVIDIA-RTX-A5000           # 24GB
                - NVIDIA-GeForce-RTX-4090    # 24GB
                - NVIDIA-TITAN-RTX           # 24GB
                - Quadro-RTX-6000            # 24GB
                - NVIDIA-L40                 # 48GB
                - NVIDIA-L40S                # 48GB
                - NVIDIA-A40                 # 48GB
                - NVIDIA-RTX-A6000           # 48GB
      # Some 48GB nodes (A6000/A40/L40) carry the large-gpu hardware taint; tolerate it so
      # they stay in the pool. This is a hardware taint, NOT preemption — the pod is still
      # non-preemptible (no opportunistic priorityClass). Harmless on the 24GB cards.
      tolerations:
      - key: nautilus.io/hardware
        operator: Equal
        value: large-gpu
        effect: NoSchedule
      containers:
      - name: judge
        image: vllm/vllm-openai:latest
        command: ["python3"]
        args:
        - /code/gpu_judge.py
        - --model
        - Qwen/Qwen2.5-7B-Instruct
        - --system-prompt
        - /code/round2_system_prompt.txt
        - --dataset
        - esci=/data/esci_eval_sample.jsonl.gz
        - --dataset
        - wands=/data/wands_eval_sample.jsonl.gz
        - --max-model-len
        - "4096"
        env:
        - name: HF_HOME
          value: /workspace/hf
        - name: HF_HUB_ENABLE_HF_TRANSFER
          value: "0"
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: spawn
        resources:
          # requests == limits (ratio 1.0, satisfies NRP's <=1.2x rule) and kept MODEST so the
          # pod fits alongside other tenants on a shared A6000 node (7-CPU request was causing
          # "Insufficient cpu" on otherwise-free A6000s). A single 7B vLLM run needs little host
          # CPU/RAM — the weights live in the 48GB GPU.
          requests:
            cpu: "3"
            memory: 20Gi
            ephemeral-storage: 40Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "3"
            memory: 20Gi
            ephemeral-storage: 40Gi
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: code
          mountPath: /code
        - name: data
          mountPath: /data
        - name: workspace
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: code
        configMap:
          name: round2-code
      - name: data
        configMap:
          name: round2-data
      - name: workspace
        emptyDir: {}
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
