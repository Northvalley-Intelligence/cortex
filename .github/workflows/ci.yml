name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # trufflehog, not gitleaks-action: gitleaks-action needs a paid license on org repos.
      - uses: trufflesecurity/trufflehog@v3.88.0
        with:
          extra_args: --results=verified,unknown
